<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculadora</title>
</head>
<body>
    <div id="appBg">
        <form name="caculator">
            <input type="textfield" name="ans" value="" autocomplete="off" readonly>

            <input type="button" value="7" onclick="document.caculator.ans.value+='7'" class="gray">
            <input type="button" value="8" onclick="document.caculator.ans.value+='8'" class="gray">
            <input type="button" value="9" onclick="document.caculator.ans.value+='9'" class="gray">
            <input type="button" value="+" onclick="document.caculator.ans.value+='+'" class="orange">
            <br>
            <input type="button" value="4" onclick="document.caculator.ans.value+='4'" class="gray">
            <input type="button" value="5" onclick="document.caculator.ans.value+='5'" class="gray">
            <input type="button" value="6" onclick="document.caculator.ans.value+='6'" class="gray">
            <input type="button" value="-" onclick="document.caculator.ans.value+='-'" class="orange">
            <br>
            <input type="button" value="1" onclick="document.caculator.ans.value+='1'" class="gray">
            <input type="button" value="2" onclick="document.caculator.ans.value+='2'" class="gray">
            <input type="button" value="3" onclick="document.caculator.ans.value+='3'" class="gray">
            <input type="button" value="X" onclick="document.caculator.ans.value+='*'" class="orange">
            <br>
            <input type="button" value="0" onclick="document.caculator.ans.value+='0'" class="gray">
            <input type="reset" value="C" class="gray">
            <input type="button" value="=" onclick="document.caculator.ans.value=eval(document.caculator.ans.value)" class="gray" >
            <input type="button" value="/" onclick="document.caculator.ans.value+='/'" class="orange">

        </form>
    </div>
    
</body>
</html>
